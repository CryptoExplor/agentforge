[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-sdk"
version = "0.1.0"
description = "Python SDK for AgentForge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "cryptography>=50.0.1,<51"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
