name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m py_compile server/agentforge_server/*.py server/agentforge_server/adapters/*.py sdk/python/agentforge_sdk/*.py
      - run: pytest -q
