[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "Open Agent Work Exchange reference implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "cryptography>=43,<47",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "alembic>=1.13,<2",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "jsonschema>=4.20,<5"]

[project.scripts]
agentforge = "agentforge_server.app:main"

[tool.setuptools]
packages = ["agentforge_server", "agentforge_server.adapters", "agentforge_server.validators", "agentforge_sdk"]

[tool.setuptools.package-dir]
agentforge_server = "server/agentforge_server"
"agentforge_server.adapters" = "server/agentforge_server/adapters"
agentforge_sdk = "sdk/python/agentforge_sdk"

[tool.pytest.ini_options]
pythonpath = ["server", "sdk/python"]
testpaths = ["tests"]
