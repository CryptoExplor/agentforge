# Production-like compose file. For local faucet/auto-schema behavior use
# docker-compose.dev.yml instead.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_AUTO_CREATE_SCHEMA: "false"
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://agentforge:agentforge@postgres:5432/agentforge
      AGENTFORGE_ENABLE_MOCK_FAUCET: "false"
      # Outbox delivery and claim reaping run in a separate process. Publishing
      # stays disabled until an operator sets AGENTFORGE_GOSSIP_ENABLED and
      # AGENTFORGE_TECHNOCORE_PUBLISH_PATH, so no remote endpoint is assumed.
      AGENTFORGE_GOSSIP_ENABLED: "false"
      # AGENTFORGE_EVENT_SIGNING_KEY: supply from the deployment secret manager.
      # Production refuses an ephemeral publisher key.
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # The API completes schema startup before becoming healthy.
    command: ["python", "-m", "agentforge_server.worker"]
    stop_grace_period: 60s
    restart: on-failure
    environment:
      AGENTFORGE_ENV: production
      AGENTFORGE_AUTO_CREATE_SCHEMA: "false"
      AGENTFORGE_DATABASE_URL: postgresql+psycopg://agentforge:agentforge@postgres:5432/agentforge
      AGENTFORGE_ENABLE_MOCK_FAUCET: "false"
      AGENTFORGE_GOSSIP_ENABLED: "false"
      AGENTFORGE_OUTBOX_INTERVAL_SECONDS: "5"
      # AGENTFORGE_EVENT_SIGNING_KEY: supply from the deployment secret manager.
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentforge -d agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agentforge_pgdata:/var/lib/postgresql/data

volumes:
  agentforge_pgdata:
